
name: Insurance Claims CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: insurance_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: insurance_claims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insurance_app -d insurance_claims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://insurance_app:ci_test_password@localhost:5432/insurance_claims
      TEST_DATABASE_URL: postgresql+psycopg2://insurance_app:ci_test_password@localhost:5432/insurance_claims_test
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production
      JWT_ALGORITHM: HS256
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_PASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -U insurance_app -d insurance_claims \
            -c "CREATE DATABASE insurance_claims_test;"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run tests
        run: pytest -v
