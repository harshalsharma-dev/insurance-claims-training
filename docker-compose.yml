
services:
  db:
    image: postgres:16
    container_name: insurance-claims-db
    environment:
      POSTGRES_USER: insurance_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: insurance_claims
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_app -d insurance_claims"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: insurance-claims-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: insurance-claims-api
    ports:
      - "8000:8000"
    env_file:
      - .env  
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
    tmpfs:
      - /tmp/prometheus-multiproc  
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
